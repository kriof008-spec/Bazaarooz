<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4e89">
<title>بازار روز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap">
<style>
/* چیدمان: نوار بالا با نام و وضعیت، ردیف قیمت‌های کلیدی، تب دسته‌ها، فهرست قیمت‌ها، مبدل در انتها */
:root{
  --bg:#f5f3ee; --surface:#ffffff; --ink:#1c2230; --muted:#6a7183; --line:#e1ddd2;
  --accent:#1d4e89; --accent-soft:#e3ecf7; --saffron:#c98a12;
  --up:#13795b; --up-bg:#dff3ea; --down:#b3361f; --down-bg:#f8e3de; --flat:#6a7183; --flat-bg:#eceae3;
  --font-display:'Lalezar','Vazirmatn',Tahoma,sans-serif;
  --font-body:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f141d; --surface:#171e2b; --ink:#e8ebf2; --muted:#9099ad; --line:#263042;
    --accent:#7fb0ee; --accent-soft:#1c2b42; --saffron:#e3a93a;
    --up:#4fd0a0; --up-bg:#12332a; --down:#ff8a72; --down-bg:#3b1d17; --flat:#9099ad; --flat-bg:#222b3a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141d; --surface:#171e2b; --ink:#e8ebf2; --muted:#9099ad; --line:#263042;
  --accent:#7fb0ee; --accent-soft:#1c2b42; --saffron:#e3a93a;
  --up:#4fd0a0; --up-bg:#12332a; --down:#ff8a72; --down-bg:#3b1d17; --flat:#9099ad; --flat-bg:#222b3a;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.6;
  padding-block:0 104px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:980px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:34px;line-height:1.1;margin:0;color:var(--accent);letter-spacing:0}
.brand .sub{color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;align-items:center}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;min-width:38px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spin svg{animation:rot 0.8s linear infinite}
@keyframes rot{to{transform:rotate(-360deg)}}

.status{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--muted);font-size:13px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--flat);display:inline-block;margin-inline-end:6px}
.dot.live{background:var(--up)}
.dot.sample{background:var(--saffron)}
.dot.err{background:var(--down)}
.banner{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--flat-bg);font-size:13px;display:none}
.banner.show{display:block}

.key{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .t-name{font-size:13px;color:var(--muted)}
.tile .t-price{font-size:20px;font-weight:700;margin:2px 0 6px;overflow-wrap:anywhere}
.tile .t-unit{font-size:12px;font-weight:400;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:500;direction:ltr}
.pill.up{background:var(--up-bg);color:var(--up)}
.pill.down{background:var(--down-bg);color:var(--down)}
.pill.flat{background:var(--flat-bg);color:var(--flat)}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:1 1 360px;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;cursor:pointer;white-space:nowrap;font-size:14px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.search{flex:1 1 180px;min-width:0;max-width:260px;border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;padding:0 12px}
.search::placeholder{color:var(--muted)}

.list{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto 84px;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.star{border:0;background:none;cursor:pointer;padding:4px;color:var(--muted);line-height:0;border-radius:8px}
.star svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
.star[aria-pressed="true"]{color:var(--saffron)}
.star[aria-pressed="true"] svg{fill:currentColor}
.r-name{min-width:0}
.r-name b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-name small{color:var(--muted);font-size:12px}
.r-price{font-weight:700;text-align:left;direction:ltr;white-space:nowrap}
.r-price small{font-weight:400;color:var(--muted);font-size:12px;margin-inline-start:4px;direction:rtl;unicode-bidi:isolate}
.r-chg{text-align:left}
.flash-up{animation:fu 1.2s}
.flash-down{animation:fd 1.2s}
@keyframes fu{from{background:var(--up-bg)}to{background:transparent}}
@keyframes fd{from{background:var(--down-bg)}to{background:transparent}}
.empty{padding:28px;text-align:center;color:var(--muted)}

.conv{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.conv h2{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0 0 12px;color:var(--accent)}
.conv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted)}
.field input,.field select{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;min-width:0;width:100%}
.result{margin-top:12px;font-size:18px;font-weight:700;overflow-wrap:anywhere}
.result small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}

footer{margin-top:22px;color:var(--muted);font-size:12.5px;text-align:center}

.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.seg-b{flex:1;border:0;background:transparent;padding:9px 8px;cursor:pointer;font-size:14px;min-width:0}
.seg-b[aria-selected="true"]{background:var(--accent);color:var(--bg);font-weight:500}
.gold-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13.5px;color:var(--muted)}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
.gold-out{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.g-row{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-top:1px solid var(--line);font-size:14.5px}
.g-row:first-child{border-top:0}
.g-row span:first-child{color:var(--muted);min-width:0}
.g-row span:last-child{font-weight:500;white-space:nowrap}
.g-total{background:var(--accent-soft)}
.g-total span:first-child{color:var(--ink);font-weight:700}
.g-total span:last-child{font-size:18px;font-weight:700;color:var(--accent)}
.note{margin:12px 0 0;font-size:12.5px;color:var(--muted);line-height:1.8}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.bn{flex:1;max-width:220px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;font-size:12.5px}
.bn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bn[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:500}
@media (max-width:700px){
  .gold-grid{grid-template-columns:1fr 1fr}
  .key{grid-template-columns:repeat(2,minmax(0,1fr))}
  .conv-grid{grid-template-columns:1fr}
  .row{grid-template-columns:30px minmax(0,1fr) auto;row-gap:2px}
  .row .r-chg{grid-column:3;grid-row:2;text-align:left}
  .row .r-price{grid-column:3;grid-row:1}
  .row .star{grid-row:1 / span 2}
  .r-name{grid-row:1 / span 2}
  .search{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>بازار روز</h1>
      <span class="sub">قیمت لحظه‌ای ارز، طلا و سکه</span>
    </div>
    <div class="tools">
      <button class="icon-btn" id="refresh" type="button" aria-label="به‌روزرسانی">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span>به‌روزرسانی</span>
      </button>
      <button class="icon-btn" id="theme" type="button" aria-label="تغییر تم">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="status" role="status">
    <span><i class="dot" id="dot"></i><span id="state">در حال دریافت…</span></span>
    <span>تاریخ: <b class="num" id="d">—</b></span>
    <span>ساعت: <b class="num" id="t">—</b></span>
    <span>اونس جهانی: <b class="num" id="oz">—</b> دلار</span>
  </div>
  <div class="banner" id="banner"></div>

  <div id="v-market" data-view="market">
    <section class="key" id="key" aria-label="قیمت‌های کلیدی"></section>

    <div class="controls">
      <div class="tabs" role="tablist" id="tabs"></div>
      <input class="search" id="q" type="search" placeholder="جستجو: دلار، سکه، بیت‌کوین…" aria-label="جستجو">
    </div>

    <section class="list" id="list" aria-live="polite"></section>
  </div>

  <div id="v-gold" data-view="gold" hidden>
    <section class="conv" aria-labelledby="gh">
      <h2 id="gh">محاسبه طلا</h2>
      <div class="seg" role="tablist" aria-label="نوع معامله">
        <button type="button" class="seg-b" data-side="buy" aria-selected="true">خرید از طلافروش</button>
        <button type="button" class="seg-b" data-side="sell" aria-selected="false">فروش به طلافروش</button>
      </div>
      <div class="gold-grid">
        <div class="field"><label for="gW">وزن (گرم)</label><input id="gW" type="text" inputmode="decimal" value="5" autocomplete="off"></div>
        <div class="field"><label for="gK">عیار</label>
          <select id="gK">
            <option value="750">۱۸ عیار (۷۵۰)</option>
            <option value="999">۲۴ عیار (۹۹۹)</option>
            <option value="900">۲۱.۶ عیار (۹۰۰)</option>
            <option value="875">۲۱ عیار (۸۷۵)</option>
          </select>
        </div>
        <div class="field"><label for="gP">قیمت هر گرم (تومان)</label><input id="gP" type="text" inputmode="decimal" autocomplete="off"></div>
        <div class="field buy-only"><label for="gU">اجرت ساخت (٪ از ارزش طلا)</label><input id="gU" type="text" inputmode="decimal" value="10" autocomplete="off"></div>
        <div class="field buy-only"><label for="gS">سود فروشنده (٪)</label><input id="gS" type="text" inputmode="decimal" value="7" autocomplete="off"></div>
        <div class="field buy-only"><label for="gT">مالیات بر ارزش افزوده (٪)</label><input id="gT" type="text" inputmode="decimal" value="10" autocomplete="off"></div>
        <div class="field sell-only" hidden><label for="gD">کسر خریدار (٪ از ارزش طلا)</label><input id="gD" type="text" inputmode="decimal" value="0" autocomplete="off"></div>
      </div>
      <label class="chk"><input type="checkbox" id="gAuto" checked> قیمت هر گرم از نرخ زنده‌ی بازار گرفته شود</label>
      <div id="gOut" class="gold-out num"></div>
      <p class="note" id="gNote"></p>
    </section>
  </div>

  <div id="v-conv" data-view="conv" hidden>
    <section class="conv" aria-labelledby="ch">
      <h2 id="ch">مبدل سریع</h2>
      <div class="conv-grid">
        <div class="field"><label for="cAmt">مقدار</label><input id="cAmt" type="text" inputmode="decimal" value="100" autocomplete="off"></div>
        <div class="field"><label for="cFrom">از</label><select id="cFrom"></select></div>
        <div class="field"><label for="cTo">به</label><select id="cTo"></select></div>
      </div>
      <div class="result num" id="cOut">—</div>
    </section>
  </div>

  <footer>قیمت‌ها به تومان هستند و هر ۱۰ ثانیه خودکار به‌روز می‌شوند. این صفحه صرفاً اطلاع‌رسانی است و توصیه‌ی مالی نیست.</footer>
</div>

<nav class="bnav" id="bnav" aria-label="منوی اصلی">
  <button type="button" class="bn" data-go="market" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span>بازار</span>
  </button>
  <button type="button" class="bn" data-go="gold">
    <svg viewBox="0 0 24 24"><path d="M3 17h18l-2-6H5zM8 11l1.5-4h5L16 11"/></svg><span>محاسبه طلا</span>
  </button>
  <button type="button" class="bn" data-go="conv">
    <svg viewBox="0 0 24 24"><path d="M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4"/></svg><span>مبدل</span>
  </button>
</nav>

/* داده‌ی نمونه: فقط وقتی دریافت زنده ممکن نباشد نمایش داده می‌شود */

function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

var fa=new Intl.NumberFormat('fa-IR',{maximumFractionDigits:2});

function fmt(v){return (v<1000&&v%1!==0)?fa.format(v):fa0.format(v)}
function pct(v){return new Intl.NumberFormat('fa-IR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Math.abs(v))}
function toFaDigits(s){return String(s).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})}
function toEn(s){return String(s).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[٬,،\s]/g,'').replace('٫','.')}

function pillHTML(ch){
  var cls=ch>0?'up':ch<0?'down':'flat';
  var arrow=ch>0?'▲':ch<0?'▼':'■';
  return '<span class="pill '+cls+'"><span aria-hidden="true">'+arrow+'</span><span>'+pct(ch)+'٪</span></span>';
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function renderKey(){
  var d=state.data;if(!d)return;
  $('key').innerHTML=KEYS.map(function(k){
    var it=ITEMS.filter(function(i){return i.k===k})[0];
    var v=d.rates[k],ch=d.change[k]||0;
    if(v==null)return '';
    return '<div class="tile"><div class="t-name">'+esc(it.n)+'</div><div class="t-price num">'+fmt(v)+' <span class="t-unit">تومان</span></div>'+pillHTML(ch)+'</div>';
  }).join('');
}

function renderTabs(){
  $('tabs').innerHTML=CATS.map(function(c){
    var label=c.id==='fav'?c.name+' ('+fa0.format(state.favs.length)+')':c.name;
    return '<button class="tab" role="tab" type="button" data-cat="'+c.id+'" aria-selected="'+(state.cat===c.id)+'">'+label+'</button>';
  }).join('');
}

function norm(s){return s.replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase()}

function renderList(){
  var d=state.data;if(!d){$('list').innerHTML='<div class="empty">در حال دریافت قیمت‌ها…</div>';return}
  var q=norm(state.q.trim());
  var items=ITEMS.filter(function(i){
    if(d.rates[i.k]==null)return false;
    if(state.cat==='fav'&&state.favs.indexOf(i.k)<0)return false;
    if(state.cat!=='all'&&state.cat!=='fav'&&i.c!==state.cat)return false;
    if(q&&norm(i.n+' '+i.u+' '+i.k).indexOf(q)<0)return false;
    return true;
  });
  if(!items.length){
    $('list').innerHTML='<div class="empty">'+(state.cat==='fav'&&!q?'هنوز موردی را ستاره‌دار نکرده‌اید. روی ستاره‌ی کنار هر قیمت بزنید.':'موردی پیدا نشد.')+'</div>';
    return;
  }
  $('list').innerHTML=items.map(function(i){
    var v=d.rates[i.k],ch=d.change[i.k]||0,fav=state.favs.indexOf(i.k)>=0;
    var flash='';
    if(state.prev&&state.prev.rates[i.k]!=null&&state.prev.rates[i.k]!==v)flash=v>state.prev.rates[i.k]?' flash-up':' flash-down';
    return '<div class="row'+flash+'">'+
      '<button class="star" type="button" data-fav="'+i.k+'" aria-pressed="'+fav+'" aria-label="علاقه‌مندی: '+esc(i.n)+'"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9L3.5 9.7l5.9-.8z"/></svg></button>'+
      '<div class="r-name"><b>'+esc(i.n)+'</b><small>'+esc(i.u)+'</small></div>'+
      '<div class="r-price num">'+fmt(v)+'<small>تومان</small></div>'+
      '<div class="r-chg">'+pillHTML(ch)+'</div></div>';
  }).join('');
}

function renderStatus(){
  var d=state.data;
  var dot=$('dot'),st=$('state'),b=$('banner');
  dot.className='dot '+(state.mode==='live'?'live':state.mode==='sample'?'sample':state.mode==='error'?'err':'');
  st.textContent=state.mode==='live'?'زنده':state.mode==='sample'?'داده‌ی نمونه':state.mode==='error'?'خطا در دریافت':'در حال دریافت…';
  if(d){
    $('d').textContent=toFaDigits(d.date||'—');
    $('t').textContent=toFaDigits(d.time||'—');
    $('oz').textContent=d.ounce!=null?fa.format(d.ounce):'—';
  }
  if(state.mode==='sample'){
    b.textContent='دریافت قیمت زنده انجام نشد و داده‌ی نمونه نمایش داده می‌شود. اگر صفحه را از روی فایل یا آدرسی دیگر باز کرده‌اید، سرور قیمت‌ها باید هدر Access-Control-Allow-Origin را برگرداند تا مرورگر اجازه‌ی خواندن بدهد. مرورگر هر ۱۰ ثانیه دوباره تلاش می‌کند.';
    b.classList.add('show');
  }else{b.classList.remove('show')}
}

function renderAll(){renderStatus();renderKey();renderTabs();renderList();convCalc();goldCalc()}

/* محاسبه طلا: خرید و فروش */
var gSide=load('bazar.gside','buy');
function numIn(id){var v=parseFloat(toEn($(id).value));return isFinite(v)?v:NaN}
function autoGram(){
  var r=state.data&&state.data.rates;if(!r)return NaN;
  var k=parseInt($('gK').value,10);
  if(k===750&&r.gold)return r.gold;
  if(r.gold24)return r.gold24*k/999;
  if(r.gold)return r.gold*k/750;
  return NaN;
}
function row(l,v,cls){return '<div class="g-row'+(cls?' '+cls:'')+'"><span>'+l+'</span><span>'+v+'</span></div>'}
function T(v){return fa0.format(Math.round(v))+' تومان'}
function goldCalc(){
  var auto=$('gAuto').checked,P=$('gP');
  P.disabled=auto;
  if(auto){var ap=autoGram();P.value=isFinite(ap)?fa0.format(Math.round(ap)):''}
  var out=$('gOut'),note=$('gNote');
  var w=numIn('gW'),p=auto?autoGram():numIn('gP');
  if(!isFinite(w)||w<=0||!isFinite(p)||p<=0){out.innerHTML='<div class="empty">وزن و قیمت هر گرم را وارد کنید.</div>';note.textContent='';return}
  var raw=w*p;
  if(gSide==='buy'){
    var u=numIn('gU'),s=numIn('gS'),t=numIn('gT');
    u=isFinite(u)?u:0;s=isFinite(s)?s:0;t=isFinite(t)?t:0;
    var wage=raw*u/100,profit=(raw+wage)*s/100,tax=(wage+profit)*t/100,total=raw+wage+profit+tax;
    out.innerHTML=
      row('ارزش خام طلا ('+fa.format(w)+' گرم)',T(raw))+
      row('اجرت ساخت ('+fa.format(u)+'٪)',T(wage))+
      row('سود فروشنده ('+fa.format(s)+'٪)',T(profit))+
      row('مالیات ('+fa.format(t)+'٪ از اجرت و سود)',T(tax))+
      row('قیمت نهایی فاکتور',T(total),'g-total')+
      row('قیمت واقعی هر گرم',T(total/w))+
      row('اختلاف با ارزش خام',pct(total/raw*100-100)+'٪ بیشتر');
    note.textContent='مالیات بر ارزش افزوده فقط روی اجرت و سود فروشنده حساب می‌شود و روی خود طلا نیست. درصد اجرت بسته به نوع کار (ساده، دست‌ساز، ماشینی) فرق می‌کند و سود فروشنده معمولاً ۷٪ است. اگر فاکتور شما درصد دیگری دارد، عددها را تغییر دهید.';
  }else{
    var d=numIn('gD');d=isFinite(d)?d:0;
    var ded=raw*d/100,get=raw-ded;
    out.innerHTML=
      row('ارزش خام طلا ('+fa.format(w)+' گرم)',T(raw))+
      row('کسر خریدار ('+fa.format(d)+'٪)',T(ded))+
      row('مبلغ دریافتی تقریبی',T(get),'g-total')+
      row('دریافتی هر گرم',T(get/w));
    note.textContent='هنگام فروش، اجرت ساخت و مالیاتی که موقع خرید داده‌اید معمولاً برگردانده نمی‌شود و خریدار فقط ارزش خام طلا (بسته به عیار و سالم‌بودن آن) را حساب می‌کند. اگر طلافروش از شما کسر یا کارمزد می‌گیرد، درصدش را در «کسر خریدار» وارد کنید.';
  }
}
function setSide(s){
  gSide=s;save('bazar.gside',s);
  Array.prototype.forEach.call(document.querySelectorAll('.seg-b'),function(b){b.setAttribute('aria-selected',b.getAttribute('data-side')===s)});
  Array.prototype.forEach.call(document.querySelectorAll('.buy-only'),function(e){e.hidden=s!=='buy'});
  Array.prototype.forEach.call(document.querySelectorAll('.sell-only'),function(e){e.hidden=s!=='sell'});
  goldCalc();
}

/* نوار پایین: جابه‌جایی بین بخش‌ها */
function showView(v){
  if(['market','gold','conv'].indexOf(v)<0)v='market';
  Array.prototype.forEach.call(document.querySelectorAll('[data-view]'),function(e){e.hidden=e.getAttribute('data-view')!==v});
  Array.prototype.forEach.call(document.querySelectorAll('.bn'),function(b){
    if(b.getAttribute('data-go')===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  save('bazar.view',v);window.scrollTo(0,0);
}

/* مبدل */
function buildConv(){
  var opts='<option value="toman">تومان</option>'+ITEMS.map(function(i){return '<option value="'+i.k+'">'+esc(i.n)+'</option>'}).join('');
  $('cFrom').innerHTML=opts;$('cTo').innerHTML=opts;
  $('cFrom').value=load('bazar.from','dollar');
  $('cTo').value=load('bazar.to','toman');
}
function valOf(k){return k==='toman'?1:(state.data&&state.data.rates[k])}
function nameOf(k){if(k==='toman')return 'تومان';var it=ITEMS.filter(function(i){return i.k===k})[0];return it?it.n:k}
function convCalc(){
  var out=$('cOut');
  var a=parseFloat(toEn($('cAmt').value));
  var f=valOf($('cFrom').value),t=valOf($('cTo').value);
  if(!state.data||!isFinite(a)||!f||!t){out.textContent='—';return}
  var r=a*f/t;
  var s=new Intl.NumberFormat('fa-IR',{maximumFractionDigits:r<1?6:r<100?4:0}).format(r);
  out.innerHTML=s+' '+esc(nameOf($('cTo').value))+'<small>'+new Intl.NumberFormat('fa-IR',{maximumFractionDigits:6}).format(a)+' '+esc(nameOf($('cFrom').value))+' به نرخ فعلی</small>';
}

/* دریافت داده */
var busy=false;
function validate(j){return j&&typeof j==='object'&&j.rates&&typeof j.rates==='object'}
function fetchData(manual){
  if(busy)return;busy=true;
  var btn=$('refresh');btn.classList.add('spin');
  var ctl=('AbortController' in window)?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort()},12000);
  var url=API+(API.indexOf('?')<0?'?':'&')+'_='+Date.now();
  fetch(url,{cache:'no-store',signal:ctl?ctl.signal:undefined})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(j){
      if(!validate(j))throw new Error('bad shape');
      j.change=j.change||{};
      state.prev=state.data&&state.mode==='live'?state.data:null;
      state.data=j;state.mode='live';
    })
    .catch(function(){
      if(!state.data||state.mode!=='live'){state.data=SAMPLE;state.mode='sample'}
      else{state.mode='live'}
    })
    .then(function(){clearTimeout(to);busy=false;btn.classList.remove('spin');renderAll()});
}

/* رویدادها */
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('[data-cat]');if(!b)return;
  state.cat=b.getAttribute('data-cat');save('bazar.cat',state.cat);renderTabs();renderList();
});
$('list').addEventListener('click',function(e){
  var b=e.target.closest('[data-fav]');if(!b)return;
  var k=b.getAttribute('data-fav'),i=state.favs.indexOf(k);
  if(i<0)state.favs.push(k);else state.favs.splice(i,1);
  save('bazar.favs',state.favs);renderTabs();renderList();
});
$('q').addEventListener('input',function(e){state.q=e.target.value;renderList()});
$('refresh').addEventListener('click',function(){fetchData(true)});
['cAmt','cFrom','cTo'].forEach(function(id){
  $(id).addEventListener('input',function(){
    save('bazar.from',$('cFrom').value);save('bazar.to',$('cTo').value);convCalc();
  });
});
$('theme').addEventListener('click',function(){
  var r=document.documentElement,cur=r.getAttribute('data-theme');
  if(!cur)cur=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  var nx=cur==='dark'?'light':'dark';
  r.setAttribute('data-theme',nx);save('bazar.theme',nx);
});
(function(){var t=load('bazar.theme',null);if(t)document.documentElement.setAttribute('data-theme',t)})();

$('bnav').addEventListener('click',function(e){
  var b=e.target.closest('[data-go]');if(!b)return;showView(b.getAttribute('data-go'));
});
Array.prototype.forEach.call(document.querySelectorAll('.seg-b'),function(b){
  b.addEventListener('click',function(){setSide(b.getAttribute('data-side'))});
});
['gW','gK','gP','gU','gS','gT','gD','gAuto'].forEach(function(id){
  $(id).addEventListener('input',goldCalc);$(id).addEventListener('change',goldCalc);
});

buildConv();
setSide(gSide);
showView(load('bazar.view','market'));
renderTabs();renderList();
fetchData();
setInterval(function(){if(!document.hidden)fetchData()},REFRESH_MS);
document.addEventListener('visibilitychange',function(){if(!document.hidden)fetchData()});
})();
</script>
</body>
</html>
